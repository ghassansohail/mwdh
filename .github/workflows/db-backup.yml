name: Daily Database Backup

on:
  schedule:
    # Runs every day at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions UI

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Install PostgreSQL Client & AWS CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl unzip

          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          . /etc/os-release
          printf 'Types: deb\nURIs: https://apt.postgresql.org/pub/repos/apt\nSuites: %s-pgdg\nArchitectures: %s\nComponents: main\nSigned-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc\n' \
            "$VERSION_CODENAME" "$(dpkg --print-architecture)" \
            | sudo tee /etc/apt/sources.list.d/pgdg.sources > /dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

          case "$(uname -m)" in
            x86_64) AWS_CLI_ARCH=x86_64 ;;
            aarch64|arm64) AWS_CLI_ARCH=aarch64 ;;
            *) echo "Unsupported runner architecture: $(uname -m)" >&2; exit 1 ;;
          esac

          curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-${AWS_CLI_ARCH}.zip" -o /tmp/awscliv2.zip
          unzip -q /tmp/awscliv2.zip -d /tmp
          sudo /tmp/aws/install --update

      - name: Dump Database
        run: |
          set -euo pipefail
          BACKUP_DATE=$(date +'%Y-%m-%d_%H-%M-%S')
          BACKUP_FILE="backup_${BACKUP_DATE}.sql.gz"
          echo "BACKUP_FILE=${BACKUP_FILE}" >> $GITHUB_ENV

          # pg_dump through gzip compression
          # Exclude internal Supabase schemas if you only want your application data:
          pg_dump "${{ secrets.DATABASE_URL }}" \
            --clean \
            --if-exists \
            --no-owner \
            --no-privileges \
            | gzip > "${BACKUP_FILE}"

      - name: Upload to Cloudflare R2 (S3-compatible)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          aws s3 cp "${{ env.BACKUP_FILE }}" "s3://${{ secrets.R2_BUCKET_NAME }}/${{ env.BACKUP_FILE }}" \
            --endpoint-url "${{ secrets.R2_ENDPOINT_URL }}"

      - name: Retention - Delete backups older than 30 days (Optional)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          # You can also configure lifecycle rules directly inside the Cloudflare R2 dashboard
          echo "Upload complete: ${{ env.BACKUP_FILE }}"
